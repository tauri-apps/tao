name: CI


on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Windows
          - { id: windows, target: x86_64-pc-windows-msvc, os: windows-latest }
          # Ubuntu with default features
          - { id: ubuntu, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          # macOS
          - { id: macos, target: x86_64-apple-darwin, os: macos-latest }
          # Android on Ubuntu
          - {
              id: android,
              target: aarch64-linux-android,
              os: ubuntu-latest,
              cmd: "apk --",
            }
          # iOS on Ubuntu
          - { id: ios, target: aarch64-apple-ios, os: macos-latest }
        features:
          - "" # default features
          - "serde" # serde + default features
          - "rwh_04,rwh_05,rwh_06" # rwh features

    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-C debuginfo=0"
      OPTIONS: ${{ matrix.platform.options }}
      FEATURES: ${{ format(',{0}', matrix.features ) }}
      CMD: ${{ matrix.platform.cmd }}

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Gtk (ubuntu only)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install GCC Multilib
        if: (matrix.platform.os == 'ubuntu-latest') && contains(matrix.platform.target, 'i686')
        run: sudo apt-get install gcc-multilib

      - name: Install cargo-apk
        if: contains(matrix.platform.target, 'android')
        run: cargo install cargo-apk

      - uses: dtolnay/rust-toolchain@1.92
        with:
          targets: ${{ matrix.platform.target }}

      - name: Check documentation
        shell: bash
        run: cargo $CMD doc --no-deps --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Build
        shell: bash
        run: cargo $CMD build --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Build tests
        shell: bash
        run: cargo $CMD test --no-run --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Run tests
        shell: bash
        if: (
          !contains(matrix.platform.target, 'android') &&
          !contains(matrix.platform.target, 'ios'))
        run: cargo $CMD test --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Build with all features enabled
        shell: bash
        run: cargo $CMD build --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Build tests with all features enabled
        shell: bash
        run: cargo $CMD test --no-run --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - name: Run tests with all features enabled
        shell: bash
        if: (
          !contains(matrix.platform.target, 'android') &&
          !contains(matrix.platform.target, 'ios'))
        run: cargo $CMD test --verbose --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

      - uses: dtolnay/rust-toolchain@nightly
        if: (
          !contains(matrix.platform.target, 'android') &&
          !contains(matrix.platform.target, 'ios'))
        with:
          targets: ${{ matrix.platform.target }}
          components: miri

      - name: Run tests with miri
        if: (
          !contains(matrix.platform.target, 'android') &&
          !contains(matrix.platform.target, 'ios'))
        shell: bash
        run: cargo +nightly miri test --target ${{ matrix.platform.target }} $OPTIONS --features $FEATURES

  # runs examples/mobile/e2e/android.sh on an emulator, see examples/mobile/README.md
  android_e2e:
    name: android e2e (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Android 11 (back destroys the root activity) and Android 16
        api-level: [30, 36]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.92
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/mobile
          key: cargo-mobile2-0.23.0
          # cargo-mobile2's templates, installed with the binary cached in ~/.cargo/bin
          cache-directories: ~/.cargo/.cargo-mobile2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install cargo-mobile2
        run: cargo install cargo-mobile2 --version 0.23.0 --locked

      - name: Build the example
        working-directory: examples/mobile
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo mobile init --non-interactive --skip-dev-tools --skip-targets-install
          cargo android apk build x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: examples/mobile
          script: adb install -r gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk && ARTIFACTS_DIR=e2e-artifacts ./e2e/android.sh --no-build

      - name: Upload logcat and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-api-${{ matrix.api-level }}
          path: examples/mobile/e2e-artifacts

  test_tao_macros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: bash
        run: cargo test --package tao-macros --examples

  fmt:
    name: fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
